{% extends "base.html" %}

{% block title %}
Delete Property | BelleStays Paris
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4 text-center">

                <h2 class="mb-4">
                    Delete Property
                </h2>

                <p class="lead">
                    Are you sure you want to delete
                    <strong>{{ listing.title }}</strong>?
                </p>

                <p class="text-muted">
                    This action cannot be undone.
                </p>

                <form method="post">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Delete Property
                    </button>

                    <a
                        href="{% url 'my_listings' %}"
                        class="btn btn-outline-secondary ms-2"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
